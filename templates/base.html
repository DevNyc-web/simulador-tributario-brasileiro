<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Simulador Tributário Brasileiro{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Simulador Tributário</a>
    <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <nav class="nav" id="nav">
      <a href="{{ url_for('index') }}#perfis">Perfis</a>
      <a href="{{ url_for('index') }}#transicao">Transição</a>
      <a class="btn btn-sm" href="{{ url_for('simulation') }}">Nova Simulação</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    Ferramenta educacional. Não substitui orientação contábil ou jurídica.
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
